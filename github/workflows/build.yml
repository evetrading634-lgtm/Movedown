name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o movedown.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: movedown/android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MoveDown-apk
          path: movedown/android/app/build/outputs/apk/debug/*.apk
